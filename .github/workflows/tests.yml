name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile Python sources
        run: >-
          python -m py_compile
          python/clip_tokenizer.py
          python/rknn_target_pipeline.py
          python/verify_dynamic_targets.py
          python/realtime_target_ui.py
          python/benchmark_npu_modes.py
          conversion/download_onnx.py
          conversion/convert_models.py
          scripts/download_models.py
          scripts/build_model_release.py

      - name: Run unit tests
        working-directory: python
        run: python -m unittest discover -v

      - name: Check release contents
        run: python scripts/check_release.py
